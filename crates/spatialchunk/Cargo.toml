[package]
name = "spatialchunk"
version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
keywords = ["arrow"]
rust-version = "1.94"

[features]
default = []
icechunk = ["dep:zarrs_icechunk"]
s3 = ["zarrs_object_store/aws"]
gcs = ["zarrs_object_store/gcp"]

[dependencies]
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-stream = "0.3"
async-trait = { version = "0.1.89" }
base64 = { version = "0.22.1" }
bytes = { version = "1.12.1" }
chrono = { version = "0.4.42" }
datafusion = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-datasource-parquet = { workspace = true }
delegate = { version = "0.13.5" }
futures = { version = "0.3.31" }
futures-util = { version = "0.3.31" }
geo-index = "0.3"
geo-traits = {version = "0.3.0" }
geo-types = { version = "0.7.18" }
i_overlay = { version = "9.1.0" }
itertools = { version = "0.14.0" }
ndarray = { version = "0.17.1" }
object_store = { version = "0.13.2" }
serde_json = { version = "1.0.145" }
tokio = { workspace = true }
tokio-test = { version = "0.4.4" }
wkb = { version = "0.9.2" }
wkt = "0.10"
zarrs = { version = "0.23.13", features = ["async", "pcodec"] }
zarrs_filesystem = { version = "0.3.0" }
zarrs_icechunk = { version = "0.5.1", optional = true }
zarrs_metadata = { version = "0.7.5" }
zarrs_object_store = { version = "0.6.2" }
zarrs_storage = { version = "0.4.0", features = ["async"] }

[dev-dependencies]
# same version as datafusion's parquet. geospatial is for writing test files
# with the parquet GEOMETRY logical type, it's also enabled on datafusion's
# parquet in test builds (cargo unifies the features).
# pinned to 58.3.x: parquet 58.4.0 needs parquet-geospatial 58.4.0, which isn't
# published yet. datafusion only needs ^58.3.0, so it uses this version too.
parquet = { version = "~58.3", features = ["arrow", "geospatial"] }
geos = { version = "8" }
walkdir = { version = "2.5.0" }

[[example]]
name = "overture_era5_join"
required-features = ["icechunk", "s3"]
